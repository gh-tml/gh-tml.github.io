name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # 允许手动触发工作流
  workflow_dispatch:

# 设置GITHUB_TOKEN的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保同时只有一个部署在运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建作业
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies (if any)
        run: |
          if [ -f package.json ]; then
            echo "Installing root dependencies..."
            if [ -f package-lock.json ]; then
              npm ci
            else
              echo "No root package-lock.json found, falling back to npm install"
              npm install
            fi
          else
            echo "No root package.json found, skipping root install"
          fi

          
      - name: Build generated assets (if needed)
        run: |
          if [ -f package.json ]; then
            echo "Running npm build..."
            npm run build
          elif [ -f generate-index.js ]; then
            echo "Running generate-index.js..."
            node generate-index.js
          else
            echo "No build step found, skipping"
          fi

      - name: Verify generated files are committed (PR only)
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are out of date. Please run: npm run build (or node generate-index.js) and commit the changes."
            echo ""
            echo "Changed files:"
            git status --porcelain
            exit 1
          fi
          
      - name: Prepare build directory
        run: |
          echo "Preparing build directory for GitHub Pages"
          mkdir -p ./build
          # 复制发布文件，排除依赖与缓存目录，避免上传阶段打包瞬时文件失败
          rsync -a --delete \
            --exclude 'build/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.agents/' \
            --exclude '.npm-cache/' \
            --exclude 'node_modules/' \
            --exclude 'node_modules/' \
            --exclude 'tmp-playwright/' \
            --exclude 'test-results/' \
            ./ ./build/
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  # 部署作业
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
